name: Merge provider submissions

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Submission ID that triggered the merge"
        required: false
        type: string

  repository_dispatch:
    types:
      - merge-provider-submissions

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: provider-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout provider repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for Wrangler
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wrangler
        run: npm install -g wrangler@4.100.0

      - name: Merge accepted Cloudflare submissions
        env:
          STEAMIDRA_API_BASE: https://stea-provider-api.steamidra.workers.dev
          STEAMIDRA_ADMIN_TOKEN: ${{ secrets.STEAMIDRA_ADMIN_TOKEN }}
          STEAMIDRA_ACCEPTED_MIN_RUN_ID: gha-20260630-180233-28465451350
          STEAMIDRA_MAX_ITEM_ID: "50000000"
        run: |
          python .github/scripts/merge_accepted_from_worker.py

      - name: Safety check provider diff
        run: |
          set -e

          git diff --check

          diff_line="$(git diff --numstat -- fallback_depotkeys.json || true)"
          echo "fallback_depotkeys.json numstat: ${diff_line}"

          if [ -z "${diff_line}" ]; then
            echo "No fallback_depotkeys.json changes."
            exit 0
          fi

          additions="$(echo "${diff_line}" | awk '{print $1}')"
          deletions="$(echo "${diff_line}" | awk '{print $2}')"

          if [ "${additions}" = "-" ] || [ "${deletions}" = "-" ]; then
            echo "Safety stop: binary or unreadable diff for fallback_depotkeys.json."
            exit 1
          fi

          echo "fallback_depotkeys.json additions: ${additions}"
          echo "fallback_depotkeys.json deletions: ${deletions}"

          if [ "${deletions}" -gt 5000 ]; then
            echo "Safety stop: fallback_depotkeys.json has too many deletions."
            exit 1
          fi

          if [ "${additions}" -gt 50000 ]; then
            echo "Safety stop: fallback_depotkeys.json has too many additions."
            exit 1
          fi

      - name: Commit provider changes
        run: |
          git config user.name "SteaMidra Provider Bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No provider changes to commit."
          else
            git commit -m "Merge accepted provider submissions"
            git push
          fi

      - name: Upload updated provider to Cloudflare R2 fallback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 object put steam-depot-fallback/fallback_depotkeys.json \
            --file fallback_depotkeys.json \
            --content-type "application/json; charset=utf-8" \
            --remote
